<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAP – Redigera innehåll</title>
<style>
body{background:#0b0b0b;color:#fff;font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px}
h1{color:#ff2bd6}h2{color:#b6ff2e;margin-top:30px;border-bottom:1px solid #333}
label{display:block;margin:8px 0 2px;color:#bbb;font-size:14px}
input,textarea{width:100%;padding:9px;background:#161616;border:1px solid #333;color:#fff;border-radius:8px;font:inherit}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:#121212;padding:10px;border-radius:10px;margin:8px 0;position:relative}
button{background:#ff2bd6;color:#000;border:0;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.add{background:#b6ff2e}.del{background:#333;color:#fff;padding:6px 10px}
.bar{position:sticky;top:0;background:#0b0b0bee;padding:10px 0;z-index:2}
.tip{background:#1b1b1b;border-left:4px solid #b6ff2e;padding:10px;border-radius:6px}
</style></head><body>
<h1>⚡ ZAP – Redigera hemsidan</h1>
<p class="tip">1. Ändra i fälten. 2. Klicka <b>Ladda ner content.json</b>. 3. Ersätt den gamla filen <code>content.json</code> i sajtmappen med den nya och ladda upp sajten igen (se README-SV.md). Lämna pris tomt så visas inget pris. Bild = filnamn i mappen <code>img/</code>.</p>
<div class="bar"><button id="dl">⬇ Ladda ner content.json</button> <label style="display:inline">eller öppna en annan fil: <input type="file" id="file" accept=".json" style="width:auto"></label></div>
<div id="form">Laddar…</div>
<script>
let c;
const F={
 'Företag':[['foretag','namn','Namn'],['foretag','slogan','Slogan'],['foretag','epost','E-post för bokning'],['foretag','instagram','Instagram-länk'],['foretag','facebook','Facebook-länk']],
 'Här står vi idag':[['idag','plats','Plats'],['idag','tid','Tid'],['idag','notis','Notis']],
 'Veckans meny':[['meny','rubrik','Rubrik (t.ex. Meny v43)'],['meny','info','Info']],
 'The Green Menu':[['grona_menyn','rubrik','Rubrik']],
 'Schema':[['schema','rubrik','Rubrik (t.ex. Vecka 43)'],['schema','kartsok','Adress för kartan']]
};
const LISTS={
 'Veckans meny':[c=>c.meny.ratter,['namn','beskrivning','pris','tagg','bild','veg'],{namn:'',beskrivning:'',pris:'',tagg:'',bild:'',veg:false}],
 'The Green Menu':[c=>c.grona_menyn.ratter,['namn','pris','veg'],{namn:'',pris:'',veg:true}],
 'Sötsaker':[c=>c.grona_menyn.sotsaker,['namn','pris','veg'],{namn:'',pris:'',veg:true}],
 'Schema':[c=>c.schema.dagar,['dag','tid','plats'],{dag:'',tid:'11–14',plats:''}],
 'Popups & event':[c=>c.event,['datum','titel','text','pris','bokning','veg'],{veg:false,datum:'',titel:'',text:'',pris:'',bokning:'info@pirenraa.se'}]
};
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function render(){
 let h='';
 const sections=[...new Set([...Object.keys(F),...Object.keys(LISTS),'Om oss','Galleri'])];
 for(const s of sections){
  h+=`<h2>${s}</h2>`;
  (F[s]||[]).forEach(([a,b,l])=>h+=`<label>${l}</label><input data-a="${a}" data-b="${b}" value="${esc(c[a][b])}">`);
  if(LISTS[s]){const [g,keys]=LISTS[s];g(c).forEach((it,i)=>{h+=`<div class="row">`+keys.map(k=>k==='veg'?`<div><label>vegetariskt (grönt)</label><input type="checkbox" style="width:24px;height:24px" data-l="${s}" data-i="${i}" data-k="veg" ${it.veg?'checked':''}></div>`:`<div><label>${k}</label><input data-l="${s}" data-i="${i}" data-k="${k}" value="${esc(it[k])}"></div>`).join('')+`<div><label>&nbsp;</label><button class="del" data-del="${s}" data-i="${i}">Ta bort</button></div></div>`});
   h+=`<button class="add" data-add="${s}">+ Lägg till</button>`;}
  if(s==='Om oss')h+=`<textarea id="om">${esc(c.om_oss)}</textarea>`;
  if(s==='Galleri')h+=`<label>Bildfiler i img/ (en per rad)</label><textarea id="gal" style="min-height:160px">${esc(c.galleri.join('\n'))}</textarea>`;
 }
 document.getElementById('form').innerHTML=h;
}
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.a)c[d.a][d.b]=t.value;
 else if(d.l)LISTS[d.l][0](c)[d.i][d.k]=t.type==='checkbox'?t.checked:t.value;
 else if(t.id==='om')c.om_oss=t.value;
 else if(t.id==='gal')c.galleri=t.value.split('\n').map(x=>x.trim()).filter(Boolean);});
document.addEventListener('click',e=>{const d=e.target.dataset;
 if(d.add){LISTS[d.add][0](c).push({...LISTS[d.add][2]});render()}
 if(d.del){if(confirm('Ta bort raden?')){LISTS[d.del][0](c).splice(d.i,1);render()}}});
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='content.json';a.click()};
document.getElementById('file').onchange=async e=>{c=JSON.parse(await e.target.files[0].text());render()};
fetch('content.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{c=j;render()}).catch(()=>document.getElementById('form').textContent='Kunde inte läsa content.json – öppna filen med knappen ovan.');
</script></body></html>
